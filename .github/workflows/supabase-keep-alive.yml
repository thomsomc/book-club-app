# This workflow runs every 3 days to prevent the Supabase free-tier project
# from auto-pausing due to inactivity. It just makes a small HTTP request to
# the database health endpoint — that's enough to count as "activity."

name: Supabase Keep-Alive

on:
  schedule:
    # Runs at 12:00 UTC every 3 days (Mon, Thu, Sun, etc.)
    # Cron format: minute hour day-of-month month day-of-week
    - cron: '0 12 */3 * *'
  # Also lets you trigger it manually from the GitHub Actions tab if needed
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        # Hit the auth health endpoint — it returns 200 with no auth required,
        # which is all we need to prove the project is awake and not paused.
        run: |
          echo "Pinging Supabase to prevent inactivity pause..."
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health")
          echo "Response status: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "Ping successful — Supabase project is active."
          else
            echo "Unexpected status $HTTP_STATUS — project may be unhealthy."
            exit 1
          fi
